[project]
name = "gis-assistant-mcp"
version = "0.1.0"
description = "AI-powered GIS workflow automation via MCP, backed by QGIS"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Michael Stone", email = "mfstone11235@gmail.com"},
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "anthropic>=1.0.0",
    "pydantic>=2.0.0",
    "starlette>=0.37.0",
    "anyio>=4.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Claude is the default provider and needs nothing extra. Install this only to
# run with GIS_PLANNER_PROVIDER=openai:  uv sync --extra openai
openai = ["openai>=1.30.0"]

[dependency-groups]
# Deliberately Claude-only: the OpenAI-specific tests skip themselves when the
# extra is absent, which is what proves the extra is genuinely optional. To
# exercise them:  uv sync --extra openai
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gis_assistant"]

[project.scripts]
gis-assistant = "gis_assistant.server:main"
gis-assistant-api = "gis_assistant.api:main"
